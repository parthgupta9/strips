<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title> Tiger Hero</title>
  <style>

@font-face {
  font-family: "khand";
  src: url("https://res.cloudinary.com/dtkyyuhzx/raw/upload/v1766118079/Comico_kudbyw.otf")
       format("opentype");
  font-weight: normal;
  font-style: normal;
}

@font-face {
  font-family: "GothamBold";
  src: url("https://res.cloudinary.com/dtkyyuhzx/raw/upload/v1766118078/_Gotham-Bold_0_warsgg.otf")
       format("opentype");
  font-weight: bold;
  font-style: normal;
}
@font-face{
  font-family:"khand";
  src:url("https://res.cloudinary.com/dtkyyuhzx/raw/upload/v1768833290/Khand-Bold_gmi7uz.ttf")
  format("opentype");
  font-weight:600;
  font-style:normal;
}


    /* RESET */
   /* 🔥 Prevent PDF page breaks */
* {
  page-break-inside: avoid !important;
}

body, html {
  height: auto;
}

.panel, .comic {
  break-inside: avoid;
}
  
    /* ================= TITLE ================= */
  .title {
      text-align: left;
      font-family: 'GothamBold', sans-serif;
      font-size: clamp(30px, 6vw, 60px);
      font-weight: 1000;
      font-style: italic;
      margin-left: 20px;
      color: #7a2c91;
      margin-top: 0;            /* prevent collapsed top margin gap */
      margin-bottom: -2px;      /* tuck closer to image */
      position: relative;       /* create stacking context for z-index */
      z-index: 20;              /* ensure title renders above panels */
      
    }

    /* ================= COMIC CONTAINER ================= */
   .comic {
  width: 900px;       /* 🔥 fixed width */
  max-width: 900px;
  margin: 0 auto;
}

    /* SINGLE IMAGE PANEL */
    .panel {
      position: relative;
      width: 100%;
     

    }
    /* COMIC IMAGE */
    .panel img {
      width: 100%;
      height: auto;
      max-height: 1240px;
      display: block;
      border-radius: 6px;
      margin-top: -50px;
    }
    /* ================= SPEECH BUBBLE OVERLAYS ================= */
    .speech-bubble-overlay {
      position: absolute;
      z-index: 10;
      pointer-events: none;
    }
    /* Panel 3 speech bubble (positioned over the middle-left panel) */
    .bubble-panel-3 {
      top: 24%;
      left: 45%;
      
      max-width: 500px;
      
    }
    .bubble-panel-7{
        top: 44%;
        left: 4%;
        width: 50%;
        max-width: 400px;
        animation: fadeIn 0.5s ease-in 0.3s;
        animation-fill-mode: backwards;
        align-items: center;
        justify-content: center;
    }

    /* Panel 5 speech bubble (positioned over the bottom-right panel) */
   .bubble-panel-5 {
  position: absolute;

  top: 76%;
  left: 12%;

  width: 100%;
  max-width: 300px;

}


    .speech-bubble-overlay img {
      width: 100%;
      height: auto;
      filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
    }

    /* Added text styling for speech bubbles */
    .bubble-text {
      position: absolute;
     font-family: "khand", 'sans-serif';
      transform: translate(-50%, -50%);
      
    
    }
    .first{
      font-family: "khand", 'sans-serif';
font-size: 22px;
font-weight: 500;
font-style: italic;
left: 56%;
top: 50%;
width: 80%;
    }
    .second{
        font-family: "khand", "Comic Sans MS";
font-size: 18px;
font-weight: 500;
font-style: italic;
color: #783787;
left: 50%;
top: 53%;
width: 50%;
overflow: hidden;

    }
     .third{
        font-family: "khand", "Comic Sans MS", cursive;
font-size: 18px;
font-weight: 500;
color: black;
font-style: italic;
width: 80%;
left: 50%;
top: 50%;
align-items: center;
    }


    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ================= BOTTOM CAPTION ================= */
    .text-box {
      position: absolute;
      background: #fff;
      border: 3px solid #000;
      padding: 10px 22px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 14px;
      box-shadow: 4px 4px 0 #000;
      text-transform: uppercase;
      z-index: 5;
    }

    .bottom-center {
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
    }
    .hero-name {
      text-transform: uppercase;
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .text-box {
        font-size: 16px;
        padding: 8px 16px;
      }
      
      .bubble-panel-3,
      .bubble-panel-5 {
        width: 45%;
      }
    }
  </style>
</head>
<body>
  <!-- NAME POPUP -->
  

  <h1 class="title">टाइगर हीरो {{NAME}}</h1>

  <section class="comic">
    <!-- COMIC PANEL WITH OVERLAYS -->
    <div class="panel">
      <!-- Main Comic Image -->
      <img 
        src="https://res.cloudinary.com/dtkyyuhzx/image/upload/v1768314720/Ayesha_Solution_Personalized_02_Boy_Without_Text_xvoxxq.png" 
        alt="Tiger Hero Comic"
      />
      
      <!-- Added text content inside speech bubble on Panel 3 -->
      <div class="speech-bubble-overlay bubble-panel-3">
        <img 
          src="https://res.cloudinary.com/dhuvclibj/image/upload/v1766573543/Bubbles_Boy_1_iioziw.png" 
          alt="Speech Bubble Panel 3"
        />
        <div class="bubble-text first">उसे तकलीफ़ में देख, आयशा की सहेली {{NAME}} आगे आई।</div>
      </div>
      
      <!-- Added text content inside speech bubble on Panel 5 -->
      <div class="speech-bubble-overlay bubble-panel-7">
        <img 
          src="https://res.cloudinary.com/dtkyyuhzx/image/upload/v1768314883/935118cb-b2b1-467e-a247-fdc9c805a171.png" 
          alt="Speech Bubble Panel 7"
        />
        <div class="bubble-text third">उसने एक नाटक लिखा, जिसमें सफ़ेद बालों वाली एक हीरो थी </div>
      </div>
       <div class="speech-bubble-overlay bubble-panel-5">
        <img 
          src="https://res.cloudinary.com/dhuvclibj/image/upload/v1766572070/second_yvq0gs.png" 
          alt="Speech Bubble Panel 5"
        />
        <div class="bubble-text second">शुक्रिया {{NAME}}! तुम मेरे टाइगर हीरो हो।</div>
      </div>


    </div>
  </section>


</body>
</html>
