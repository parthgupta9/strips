<!DOCTYPE html>
<html>
<head>
  <title>Tiger Hero PDF</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
    }
    select, input, button {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h2 id="heading">हीरो बनिए 🐯</h2>

  <!-- 👇 FORM GOES HERE -->
  <form action="/generate-pdf" method="POST" onsubmit="handleSubmit(event)">
    <select id="languageSelect" name="language" onchange="changeLanguage()">
      <option value="hindi">हिंदी (Hindi)</option>
      <option value="english">English</option>
      <option value="marathi">मराठी (Marathi)</option>
    </select>
    
    <input id="heroInput" name="heroName" placeholder="हीरो का नाम दर्ज करें" required 
     maxlength="12"/>
    <button id="submitBtn" type="submit">डाउनलोड करें</button>
  </form>

  <script>
    const translations = {
      english: {
        heading: "Become the Hero 🐯",
        placeholder: "Enter hero name",
        button: "Download"
      },
      hindi: {
        heading: "हीरो बनिए 🐯",
        placeholder: "हीरो का नाम दर्ज करें",
        button: "डाउनलोड करें"
      },
      marathi: {
        heading: "हिरो व्हा 🐯",
        placeholder: "हिरोचे नाव टाका",
        button: "डाउनलोड करा"
      }
    };

    function changeLanguage() {
      const lang = document.getElementById('languageSelect').value;
      const t = translations[lang];
      
      document.getElementById('heading').textContent = t.heading;
      document.getElementById('heroInput').placeholder = t.placeholder;
      document.getElementById('submitBtn').textContent = t.button;
    }

    async function handleSubmit(event) {
      event.preventDefault();
      
      const form = event.target;
      const heroName = document.getElementById('heroInput').value;
      const language = document.getElementById('languageSelect').value;
      
      // Send as URL-encoded form data
      const params = new URLSearchParams();
      params.append('heroName', heroName);
      params.append('language', language);
      
      // Submit via fetch to see the result in the same page
      const response = await fetch('/generate-pdf', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: params
      });
      
      const html = await response.text();
      document.open();
      document.write(html);
      document.close();
    }
  </script>

</body>
</html>
